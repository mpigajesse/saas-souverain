# integration-tests — contrats B↔C / A↔C / chemin d'écriture gated,
# contre un etcd RÉEL démarré via testcontainers (module .ci/testcontainers).
# Les tests exigent AMANE_TEST_ETCD (module isolé tests/, non embarqué).

name: integration-tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            orchestrator-go/go.sum
            tests/go.sum
            .ci/testcontainers/go.sum

      - name: Contrats (etcd réel via testcontainers) — module tests/
        working-directory: .ci/testcontainers
        run: go run . -workdir ../../tests -- go test ./... -count=1 -race -timeout 10m
