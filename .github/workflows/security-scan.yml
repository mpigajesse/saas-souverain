# security-scan — govulncheck + gosec, bloquant sur les issues critiques.
#
# * govulncheck : vulnérabilités des dépendances. Sémantique binaire : exit ≠ 0
#   UNIQUEMENT si une vulnérabilité touche du code réellement appelé (une CVE
#   dans un module importé mais non utilisé ne bloque pas). Version épinglée.
# * gosec : SAST du code source, sévérité high + confiance high seulement
#   (le medium/low est du bruit, revue manuelle). gen/ exclu (code généré).
#   Version épinglée.
# La base OSV se met à jour quotidiennement → run sur push + cron, pas
# uniquement sur PR (une CVE publiée après la PR passerait inaperçue).

name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            orchestrator-go/go.sum
            tests/go.sum

      - name: govulncheck — orchestrator-go
        working-directory: orchestrator-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: govulncheck — tests (module isolé)
        working-directory: tests
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: gosec — orchestrator-go (sévérité high bloquante)
        working-directory: orchestrator-go
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
          -severity high -confidence high -exclude-dir=gen ./...

      - name: gosec — tests
        working-directory: tests
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
          -severity high -confidence high ./...
