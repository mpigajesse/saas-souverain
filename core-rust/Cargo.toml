[workspace]
members = [
    "ss-crypto",
    "ss-journal",
    "ss-client"
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Amane SaaS Souverain Team"]
license = "Proprietary"

[workspace.dependencies]
ss-crypto  = { path = "ss-crypto" }
ss-journal = { path = "ss-journal" }
ss-client  = { path = "ss-client" }

# Crypto
chacha20poly1305 = "0.10"
x25519-dalek     = { version = "2", features = ["static_secrets"] }
argon2           = "0.5"
blake2           = "0.10"
rand             = "0.8"
rand_core        = { version = "0.6", features = ["getrandom"] }
zeroize          = { version = "1", features = ["derive"] }

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
ciborium    = "0.2"
toml        = "0.8"
base64      = "0.22"
hex         = "0.4"

# Async & Network
tokio = { version = "1", features = ["full"] }

# Identifiants / Temps
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Erreurs & Tests
thiserror = "2"
anyhow    = "1"
tempfile  = "3"
