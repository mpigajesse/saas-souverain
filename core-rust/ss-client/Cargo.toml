[package]
name = "ss-client"
version = "0.2.0"
edition = "2021"
authors = ["Amane SaaS Souverain Team"]

[dependencies]
# Socle cryptographique unique du projet (spike/crates/)
ss-crypto = { path = "../../spike/crates/ss-crypto" }
ss-journal = { path = "../../spike/crates/ss-journal" }

# gRPC & Protobuf (Mission B & C)
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.0", features = ["full"] }

# Sérialisation & Données local
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cbor4ii = "0.3"
rusqlite = { version = "0.29", features = ["bundled"] }

# Cryptographie & Sécurité
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
rand = "0.8"

[build-dependencies]
tonic-build = "0.10"
protoc-bin-vendored = "3.0"
