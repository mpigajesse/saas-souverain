[package]
name = "ss-client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Dependencies avec crates locales Rust
ss-crypto = { path = "../ss-crypto" }
ss-journal = { path = "../ss-journal" }

# gRPC & Protobuf (Mission B & C)
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }

# Sérialisation & Données local
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cbor4ii = "0.3"
rusqlite = { version = "0.29", features = ["bundled"] }

# Cryptographie & Sécurité
ed25519-dalek = "2.0"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
thiserror = "1.0"

[build-dependencies]
tonic-build = "0.10"
