services:

  # ── CLUSTER SOUVERAIN (Mission C) ─────────────────────────

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd-amane
    environment:
      ETCD_NAME: etcd-amane
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-amane:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-amane:2380
      ETCD_INITIAL_CLUSTER: etcd-amane=http://etcd-amane:2380
      ETCD_INITIAL_CLUSTER_STATE: new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-primary:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: postgres-primary
    hostname: postgres-primary
    environment:
      ETCD3_HOSTS: "etcd-amane:2379"
      SCOPE: amane
      PATRONI_SCOPE: amane
      PATRONI_NAME: postgres-primary
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-primary:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-primary:5432
      PGPASSWORD_SUPERUSER: postgres
      PGPASSWORD_REPLICATION: repl_pass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: postgres
      PATRONI_REPLICATION_USERNAME: repl
      PATRONI_REPLICATION_PASSWORD: repl_pass
      SPILO_CONFIGURATION: |
        postgresql:
          parameters:
            synchronous_commit: "on"
            max_slot_wal_keep_size: 1024MB
        bootstrap:
          dcs:
            synchronous_mode: true
            synchronous_mode_stop_on_limit: true
    volumes:
      - pgdata-primary:/home/postgres/pgdata
    ports:
      - "5432:5432"
      - "8008:8008"
    depends_on:
      etcd:
        condition: service_healthy

  postgres-replica:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: postgres-replica
    hostname: postgres-replica
    environment:
      ETCD3_HOSTS: "etcd-amane:2379"
      SCOPE: amane
      PATRONI_SCOPE: amane
      PATRONI_NAME: postgres-replica
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-replica:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-replica:5432
      PGPASSWORD_SUPERUSER: postgres
      PGPASSWORD_REPLICATION: repl_pass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: postgres
      PATRONI_REPLICATION_USERNAME: repl
      PATRONI_REPLICATION_PASSWORD: repl_pass
      SPILO_CONFIGURATION: |
        postgresql:
          parameters:
            synchronous_commit: "on"
            max_slot_wal_keep_size: 1024MB
        bootstrap:
          dcs:
            synchronous_mode: true
            synchronous_mode_stop_on_limit: true
    volumes:
      - pgdata-replica:/home/postgres/pgdata
    ports:
      - "5433:5432"
      - "8009:8008"
    depends_on:
      etcd:
        condition: service_healthy

  # ── CONSOLE ÉDITEUR SAAS (Mission B) ──────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_editor_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://amane_admin:amane_password_sec2026@postgres-primary:5432/saas_editor
      - DEBUG=True
    depends_on:
      - postgres-primary

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_editor_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── MONITORING (Mission B) ─────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: saas_editor_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: saas_editor_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  etcd-data:
  pgdata-primary:
  pgdata-replica:
  grafana_data: