services:

  # ── CLUSTER SOUVERAIN (Mission C) ─────────────────────────

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd-amane
    environment:
      ETCD_NAME: etcd-amane
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-amane:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-amane:2380
      ETCD_INITIAL_CLUSTER: etcd-amane=http://etcd-amane:2380
      ETCD_INITIAL_CLUSTER_STATE: new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-primary:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: postgres-primary
    hostname: postgres-primary
    environment:
      ETCD3_HOSTS: "etcd-amane:2379"
      SCOPE: amane
      PATRONI_SCOPE: amane
      PATRONI_NAME: postgres-primary
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-primary:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-primary:5432
      PGPASSWORD_SUPERUSER: postgres
      PGPASSWORD_REPLICATION: repl_pass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: postgres
      PATRONI_REPLICATION_USERNAME: repl
      PATRONI_REPLICATION_PASSWORD: repl_pass
      SPILO_CONFIGURATION: |
        postgresql:
          parameters:
            synchronous_commit: "on"
            max_slot_wal_keep_size: 1024MB
        bootstrap:
          dcs:
            synchronous_mode: true
            synchronous_mode_stop_on_limit: true
    volumes:
      - pgdata-primary:/home/postgres/pgdata
    ports:
      - "5432:5432"
      # Port de secours : sur un poste Windows où un PostgreSQL natif occupe
      # déjà 5432, c'est lui qui répond sur localhost et le mapping ci-dessus
      # est masqué. 5434 donne une route sûre vers le primaire du cluster.
      - "5434:5432"
      - "8008:8008"
    depends_on:
      etcd:
        condition: service_healthy

  postgres-replica:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: postgres-replica
    hostname: postgres-replica
    environment:
      ETCD3_HOSTS: "etcd-amane:2379"
      SCOPE: amane
      PATRONI_SCOPE: amane
      PATRONI_NAME: postgres-replica
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-replica:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-replica:5432
      PGPASSWORD_SUPERUSER: postgres
      PGPASSWORD_REPLICATION: repl_pass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: postgres
      PATRONI_REPLICATION_USERNAME: repl
      PATRONI_REPLICATION_PASSWORD: repl_pass
      SPILO_CONFIGURATION: |
        postgresql:
          parameters:
            synchronous_commit: "on"
            max_slot_wal_keep_size: 1024MB
        bootstrap:
          dcs:
            synchronous_mode: true
            synchronous_mode_stop_on_limit: true
    volumes:
      - pgdata-replica:/home/postgres/pgdata
    ports:
      - "5433:5432"
      - "8009:8008"
    depends_on:
      etcd:
        condition: service_healthy

  # ── CONSOLE ÉDITEUR SAAS (Mission B) ──────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_editor_backend
    restart: always
    # migrate avant runserver : le conteneur peut redémarrer tant que Patroni
    # n'a pas encore élu de primaire (restart: always relance jusqu'au succès).
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    # config/settings.py lit SECRET_KEY et DB_* via python-decouple : le fichier
    # .env local (jamais committé) est la seule source de ces valeurs.
    env_file:
      - .env
    volumes:
      # Archives `docker save` de l'image du nœud PME. Montage lié (et non
      # volume nommé) : le script de publication tourne sur l'hôte Windows et
      # écrit directement dans ./media, que Django sert ensuite en
      # téléchargement à la console.
      - ./media:/app/media
    environment:
      # Depuis le réseau compose, on joint le primaire par son nom de service et
      # son port interne — surtout pas le port publié côté hôte.
      - DB_HOST=postgres-primary
      - DB_PORT=5432
    depends_on:
      - postgres-primary

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_editor_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── MONITORING (Mission B) ─────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: saas_editor_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml

  # ── DISTRIBUTION DE L'IMAGE DU NŒUD PME ────────────────────

  # Registre Docker de l'éditeur. Les machines PME du réseau local y tirent
  # l'image du nœud : `docker pull <IP_DU_PC_EDITEUR>:5000/ss-node:v2`.
  # Publié sur 0.0.0.0 comme le reste de la stack, donc joignable depuis le LAN.
  # Registre en clair (HTTP) : réservé au banc de test, les postes clients
  # doivent le déclarer en `insecure-registries` (les installeurs le font).
  registry:
    image: registry:2
    container_name: saas_editor_registry
    restart: always
    ports:
      - "5000:5000"
    environment:
      # Autorise la suppression d'une révision d'image (republication d'un tag).
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry

  grafana:
    image: grafana/grafana:latest
    container_name: saas_editor_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  etcd-data:
  pgdata-primary:
  pgdata-replica:
  grafana_data:
  registry_data: