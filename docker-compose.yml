services:
  # 1. Base de données PostgreSQL pour l'Éditeur SaaS
  db:
    image: postgres:17-alpine
    container_name: saas_editor_db
    restart: always
    environment:
      POSTGRES_DB: saas_editor
      POSTGRES_USER: amane_admin
      POSTGRES_PASSWORD: amane_password_sec2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_editor_data:/var/lib/postgresql/data

  # 2. Serveur Backend Django (Console Éditeur SaaS REST API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_editor_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://amane_admin:amane_password_sec2026@db:5432/saas_editor
      - DEBUG=True
    depends_on:
      - db

  # 3. Frontend React Vite (Console Éditeur SaaS UI / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_editor_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 4. Prometheus (Collecte des métriques d'exploitation)
  prometheus:
    image: prom/prometheus:latest
    container_name: saas_editor_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml

  # 5. Grafana (Visualisation des dashboards analytiques Éditeur)
  grafana:
    image: grafana/grafana:latest
    container_name: saas_editor_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_editor_data:
  grafana_data:
