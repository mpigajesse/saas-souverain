[package]
name = "r03-harness"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "r03"
path = "main.rs"

[dependencies]
ss-crypto = { path = "/home/jose/school/amane/repo/spike/crates/ss-crypto" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4" }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"