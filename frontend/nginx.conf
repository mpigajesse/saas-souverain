# Point d'entrée unique de la console éditeur.
#
# nginx sert le bundle React ET relaie l'API vers Django. C'est ce qui permet
# à n'importe quelle machine du réseau local d'utiliser la console en tapant
# simplement http://<IP_DU_PC_EDITEUR>:5173/ : la page et l'API partagent la
# même origine, donc plus d'URL de backend figée dans le bundle, plus de CORS,
# et le cookie de session comme le cookie CSRF sont posés sur cette origine.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker. Indispensable : dans un bloc `upstream`
    # (ou un proxy_pass littéral), nginx ne résout le nom qu'UNE FOIS, au
    # démarrage, et garde l'IP en cache à vie. Or l'IP du conteneur backend
    # change à chaque recréation — après un `docker compose up -d backend`,
    # nginx continuait de viser l'ancienne adresse et toute l'API tombait en
    # 502, sans que rien n'indique la cause. En passant par une variable,
    # nginx redemande le nom au résolveur et suit le backend où qu'il aille.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Nom de service du réseau compose — surtout pas localhost, qui désignerait
    # le conteneur nginx lui-même.
    set $django backend:8000;

    # Archives d'image du nœud PME : plusieurs centaines de Mo.
    client_max_body_size 0;

    # ── API REST + administration Django ───────────────────────────────────

    location /api/ {
        proxy_pass http://$django;

        # Host réel (avec le port vu par le navigateur) : Django en a besoin
        # pour la vérification CSRF same-origin, pour ALLOWED_HOSTS, et pour
        # que `request.get_host()` compose les bonnes URL dans les installeurs
        # et le docker-compose.yml téléchargés par les PME.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Le téléchargement de l'archive d'image peut être long sur un lien
        # Wi-Fi ; on laisse la main à Django plutôt que de couper à 60 s.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # Servir l'archive au fil de l'eau au lieu de la tamponner en entier.
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://$django;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques de l'admin Django et médias (archives d'image).
    location /static/ {
        proxy_pass http://$django;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        proxy_pass http://$django;
        proxy_set_header Host $http_host;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }

    # ── Console React ──────────────────────────────────────────────────────

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : le routage est fait par react-router dans le
    # navigateur. Sans ce fallback, un lien direct ou un F5 sur /tenants
    # renvoie 404 — nginx cherche un fichier qui n'existe pas.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
