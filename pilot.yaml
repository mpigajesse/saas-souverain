         Attendu : `ManifesteInvalide` catégorique, seuls `postgres://` et
         chemins non sensibles acceptés.
      6. D-06 : registry répondant 401, 403, 500, 302 vers 169.254.169.254.
         Attendu : 401/403/500 → erreur d'infrastructure (pas 409), SSRF bloqué.

