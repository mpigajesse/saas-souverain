  - id: HA-01
    title: Haute disponibilité — élection, mutex, keepalive, bascule HAProxy, hystérésis, bootstrap
    tier: free
    brief: |
      Les six tests du groupe HA du plan `plan-tests-amane-v3.md`
      (§ HA-01 à HA-06), sur `orchestrator-go/supervisor/`.

      1. HA-01 : élection de lease etcd. Attendu : un seul leader, les autres
         restent followers, aucune double promotion.
      2. HA-02 : mutex « force-right ». Attendu : un opérateur ne peut pas
         forcer deux bascules simultanées.
      3. HA-03 : keepalive gRPC. Attendu : la session survit à une coupure
         courte, le heartbeat reprend sans double enrôlement.
      4. HA-04 : bascule HAProxy. Attendu : le backend suit le leader en
         moins de 5 s, aucune requête routée vers un nœud non leader.
      5. HA-05 : hystérésis de synchronisation. Attendu : pas d'oscillation
         du mode synchrone quand la latence varie autour du seuil.
      6. HA-06 : bootstrap concurrent. Attendu : deux nœuds démarrés en même
         temps produisent un seul cluster, pas deux.

      S'appuyer sur `ha-lab` (projet `ha-lab` uniquement) et sur le banc de VM
      `A-00` pour ce qui exige de vraies machines. `chaos.sh` ne doit toucher
      que `ha-lab`. Sorties dans `docs/tests/artifacts-ha01/`.

      Écrire `docs/tests/HA-DISPO.md`. Un test non exécutable est `BLOQUE`.

      **Obligatoire** : lignes HA-01 à HA-06 dans `docs/tests/REGISTRE.md`,
