  - id: D-01
    title: Portail éditeur — usurpation, licence, sièges, confinement, manifeste, registry
    tier: free
    brief: |
      Les six tests du groupe D du plan `plan-tests-exhaustif-v3.md`
      (§ Groupe D, D-01 à D-06), sur `tenants/`, `applications/`, `devices/`
      (Django).

      1. D-01 : tenant B avec jeton valide mais `installation_id` du tenant A.
         Attendu : 403/409, aucune modification de la machine A.
      2. D-02 : enregistrement sur licence expirée. Attendu : 403
         `license_expired` immédiat, `is_active=False` prioritaire.
      3. D-03 : deux requêtes concurrentes `POST /api/devices/register` pour
         une licence à 1 siège. Attendu : 1×201, 1×403, compte actif = 1.
      4. D-04 : analyser le compose généré pour un tenant avec application.
         Attendu : `network.internal=True`, application sans port publié,
         ss-node + HAProxy sur le réseau applicatif, PG + etcd ailleurs.
      5. D-05 : manifeste avec volumes `/var/run/docker.sock`, `/etc`, `/proc`,
