  - id: C-01
    title: Socle cryptographique — corruption Shamir, petit ordre, sealed box, zéroïsation, journal
    tier: free
    brief: |
      Les six tests du groupe C du plan `plan-tests-exhaustif-v3.md`
      (§ Groupe C, C-01 à C-06). Ils portent sur le workspace Rust
      `spike/crates/` : `ss-crypto`, `ss-journal`, `ss-consensus`.

      À faire, dans l'ordre du plan :
      1. C-01 : altérer un octet d'une part Shamir, reconstruire la KEK,
         tenter `unwrap_dek` avec la fausse KEK. Attendu : `Err(DecryptionFailed)`.
      2. C-02 : passer les vecteurs RFC 7748 de petit ordre et le point à
         l'infini à `seal_dek` / `open_sealed_dek`. Attendu : rejet, aucune DEK
         scellée avec un secret tout-à-zéro.
      3. C-03 : tronquer le sealed box à 0/31/32/79 octets, altérer 1 bit de
         la clé éphémère. Attendu : `Err(InvalidSealedBox)` ou
         `Err(DecryptionFailed)`, jamais de panic.
      4. C-04 : récupérer un pointeur brut sur les octets internes, forcer le
         drop, inspecter en `unsafe`. Attendu : tous les octets à 0x00.
      5. C-05 : écrire un en-tête `len=256` suivi de 40 octets (torn write),
         puis `len=0xFFFFFFFF` (DoS). Attendu : `JournalError::Corrupted` ou
         `count_frames` en erreur, sans OOM.
      6. C-06 : insérer une entrée epoch=4 après une entrée epoch=5. Attendu :
         `JournalError::EpochRegression`.

      Écrire les tests dans le crate concerné (`#[cfg(test)]`), les exécuter
      avec `cargo test -p <crate>`, et **conserver la sortie brute** dans
      `docs/tests/artifacts-c01/`.

      Puis écrire `docs/tests/C-CRYPTO.md` : pour chaque test, le stimulus
      exact, l'assertion, le résultat réel, et la commande de reproduction.
      Si un test ne peut pas être écrit parce que la fonction n'existe pas ou
      n'est pas exposée, le dire et le noter `BLOQUE` dans le registre.

      **Obligatoire** : ajouter une ligne par test dans
      `docs/tests/REGISTRE.md` (codes C-01 à C-06), puis lancer
      `python3 tools/registre.py --ecrire` pour mettre la synthèse à jour.
      Sans registre à jour, la tâche échoue.
    verify:
      - type: exists
        path: docs/tests/C-CRYPTO.md
      - type: shell
        cmd: "test $(grep -cE '^\\| C-0[1-6] ' docs/tests/REGISTRE.md) -eq 6"
      - type: shell
        cmd: "python3 tools/registre.py"
      - type: artifact
        path: docs/tests/C-CRYPTO.md
        kind: md
        require: ["C-01", "C-06", "Shamir", "zé", "epoch"]
        min_lines: 50

  - id: N-01
    title: Nœud PME — quorum, fencing, enrôlement, streaming, restore, proxy
    tier: free
    brief: |
      Les six tests du groupe N du plan `plan-tests-exhaustif-v3.md`
      (§ Groupe N, N-01 à N-06). Ils portent sur `orchestrator-go/`
      (consensus, dcs), `spike/node` et `core-rust`.

      À faire, dans l'ordre du plan :
      1. N-01 : `evaluer_quorum()` avec deux membres `Role=Leader`. Attendu :
         `Etat = Perdu(Motif::SplitBrain)`, aucune écriture autorisée.
      2. N-02 : machine locale primaire à timeline=2, cluster à timeline=3.
         Attendu : `decider()` renvoie `fence:true`, `ecriture_autorisee:false`,
         rôle basculé à standby, sauvegarde annulée.
      3. N-03 : cinq requêtes invalides `POST /amane/api/enrolement`. Attendu :
         blocage IP (rate-limit), invités légitimes conservés, comparaison en
         temps constant.
      4. N-04 : `pg_dump` en flux de 5 Go (ou du plus gros volume disponible).
         Attendu : RSS < 128 Mo, authentification AEAD par morceau, offset
         seek correct.
      5. N-05 : altérer 1 bit d'un blob depuis le relais. Attendu :
         déchiffrement DEK en erreur **avant** `pg_restore --clean`, base
         locale intacte.
      6. N-06 : chemins `/amane/../`, en-têtes chunked + Content-Length,
         HTTP Upgrade, Keep-Alive croisé. Attendu : hop-by-hop épurés,
         normalisation stricte, isolation SaaS ↔ admin, 502 si application
         absente.

      Exécuter réellement : `go test ./...` dans `orchestrator-go/`, et pour
      N-06 un serveur de test local (pas la pile en service). Conserver les
      sorties dans `docs/tests/artifacts-n01/`.

